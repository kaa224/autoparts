# Add these locations to the existing HTTPS server block for rialsat.ru.
# Authentication is handled by the app with its own /etc/autoparts.env.
location = /autoparts {
    return 301 /autoparts/;
}

location /autoparts/ {
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /autoparts;
    client_max_body_size 15m;
    proxy_read_timeout 600s;
}
