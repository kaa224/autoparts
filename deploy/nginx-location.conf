# Add these locations to the existing HTTPS server block for rialsat.ru.
# The internal subrequest reuses the site's existing Basic Auth service.
location = /_autoparts_auth {
    internal;
    proxy_pass http://127.0.0.1:8790/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /autoparts {
    return 301 /autoparts/;
}

location /autoparts/ {
    auth_request /_autoparts_auth;
    proxy_pass http://127.0.0.1:8791/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /autoparts;
    client_max_body_size 15m;
    proxy_read_timeout 600s;
}
