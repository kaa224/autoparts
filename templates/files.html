<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Готовые карточки</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body><main class="shell"><header><span class="eyebrow">ГОТОВЫЕ ФАЙЛЫ</span><h1>Карточки товаров</h1>
  <p>{{ job.output_dir }}</p><a class="secondary header-link" href="{{ url_for('archives') }}">Назад к архивам</a></header><section class="panel file-grid">
  {% for file in files %}<a href="{{ url_for('job_file', job_id=job.id, filename=file.name) }}"><span>{{ file.suffix[1:]|upper }}</span>{{ file.name }}</a>
  {% else %}<p>Готовых файлов пока нет.</p>{% endfor %}
  </section></main></body>
</html>
